services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    env_file: gateway.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - foundry-gateway-data:/var/lib/foundry
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  foundry-gateway-data:
