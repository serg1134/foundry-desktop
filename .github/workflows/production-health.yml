name: Production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify website
        run: curl --fail --show-error --silent --retry 3 --retry-delay 5 https://foundryappbuilder.com/ > /dev/null
      - name: Verify gateway liveness
        run: curl --fail --show-error --silent --retry 3 --retry-delay 5 https://foundry-desktop.replit.app/health/live
      - name: Verify gateway readiness
        run: curl --fail --show-error --silent --retry 3 --retry-delay 5 https://foundry-desktop.replit.app/health/ready
