name: Cross-platform packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/main/installer.ts
      - package.json
      - package-lock.json
      - .github/workflows/cross-platform.yml

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
            artifact: release/*.dmg
          - os: ubuntu-latest
            command: dist:linux
            artifact: release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
