name: Release Foundry for Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package version
        id: package-version
        shell: powershell
        run: |
          $packageVersion=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag=$env:GITHUB_REF_NAME.TrimStart('v')
          if($tag -ne $packageVersion){throw "Tag v$tag does not match package version $packageVersion."}
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build update artifacts
        shell: powershell
        env:
          FOUNDRY_UPDATE_URL: https://github.com/serg1134/foundry-desktop/releases/latest/download
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -OutputDirectory release
      - name: Upload release trust evidence
        uses: actions/upload-artifact@v7
        with:
          name: foundry-release-trust-${{ steps.package-version.outputs.version }}
          path: |
            release/dependency-audit.json
            release/Foundry-Setup-*.exe.sha256
            release/latest.yml
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $signingNotice=@'
          ## Public beta trust notice

          This Windows beta installer is currently **unsigned**, so Windows may show an unknown-publisher or SmartScreen warning. Download only from this official release and verify the included SHA-256 checksum before installation. See the [public beta guide](https://github.com/serg1134/foundry-desktop/blob/main/docs/PUBLIC_BETA.md), [release trust policy](https://github.com/serg1134/foundry-desktop/blob/main/CODE_SIGNING.md), and [privacy notice](https://github.com/serg1134/foundry-desktop/blob/main/PRIVACY.md).
          '@
          gh release create $env:GITHUB_REF_NAME release/Foundry-Setup-*.exe release/Foundry-Setup-*.exe.blockmap release/Foundry-Setup-*.exe.sha256 release/latest.yml release/dependency-audit.json --title "Foundry $env:GITHUB_REF_NAME" --generate-notes --notes $signingNotice
