name: Release Foundry for Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        id: package-version
        shell: powershell
        run: |
          $packageVersion=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag=$env:GITHUB_REF_NAME.TrimStart('v')
          if($tag -ne $packageVersion){throw "Tag v$tag does not match package version $packageVersion."}
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build update artifacts
        shell: powershell
        env:
          FOUNDRY_UPDATE_URL: https://github.com/serg1134/foundry-desktop/releases/latest/download
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release.ps1 -OutputDirectory release
      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: foundry-unsigned-installer
          path: release/Foundry-Setup-*.exe
          if-no-files-found: error
      - name: Submit installer to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-release
          parameters: |
            version: "${{ steps.package-version.outputs.version }}"
      - name: Replace installer and finalize signed update artifacts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-signed-artifact.ps1 -SignedArtifactDirectory signed-release -ReleaseDirectory release
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $env:GITHUB_REF_NAME release/Foundry-Setup-*.exe release/Foundry-Setup-*.exe.blockmap release/Foundry-Setup-*.exe.sha256 release/latest.yml --title "Foundry $env:GITHUB_REF_NAME" --generate-notes
