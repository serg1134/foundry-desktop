name: Foundry beta feedback
description: Tell us what you built, what worked, and where you got stuck.
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: Thank you for testing Foundry. Never include passwords, API keys, payment details, private project files, or other sensitive information.
  - type: input
    id: goal
    attributes:
      label: What app were you trying to build?
      placeholder: A clipboard manager that summarizes copied text
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: How far did you get?
      options:
        - Built, installed, and worked
        - Built, but something did not work
        - Preview worked, but packaging failed
        - Build did not complete
        - I got stuck before building
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps you took and the exact non-sensitive error message.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Foundry version
      placeholder: 0.7.13
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Did Foundry install and launch?
      options:
        - Yes, without a warning
        - Yes, after a Windows or antivirus warning
        - No, installation was blocked or failed
    validations:
      required: true
  - type: dropdown
    id: generated_app
    attributes:
      label: Did the generated desktop app install and work outside Foundry?
      options:
        - Yes, including the primary workflow
        - It installed, but the primary workflow failed
        - Packaging or installation failed
        - I did not reach this step
    validations:
      required: true
  - type: dropdown
    id: persistence
    attributes:
      label: Did requested data persist after closing and reopening the generated app?
      options:
        - Yes
        - No
        - Persistence was not part of my app
        - I did not reach this step
    validations:
      required: true
  - type: dropdown
    id: uninstall
    attributes:
      label: Could you uninstall the generated app normally?
      options:
        - Yes
        - No
        - I did not try
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What was the most confusing or frustrating moment?
      description: A short answer is useful even when the build succeeded.
    validations:
      required: true
  - type: dropdown
    id: recommend
    attributes:
      label: Would you recommend Foundry to someone who does not code?
      options:
        - Yes
        - Maybe
        - No
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed passwords, API keys, personal data, and private source code.
          required: true
