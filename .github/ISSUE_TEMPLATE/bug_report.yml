name: Beta bug report
description: Report a reproducible Foundry problem without sharing private data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for testing Foundry. Never include API keys, passwords, payment information, or private project files.
  - type: input
    id: version
    attributes:
      label: Foundry version
      placeholder: 0.7.5
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Create…\n2. Click…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only privacy-safe diagnostics copied from Foundry Activity.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, credentials, personal paths, and private project content.
          required: true
